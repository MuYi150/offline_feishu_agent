[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-review-v2"
version = "0.1.0"
description = "Local multimodal review workflow for research-team knowledge-base submissions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "openai>=1.0,<3",
  "pydantic>=2.10,<3",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
wiki-review-v2 = "wiki_review_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["real_kimi: explicitly enabled tests that call the real Kimi API"]

